# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows
    # gaps_in = 0
    # gaps_out = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 4
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# Picture-in-Picture (native Chrome/Chromium window)
#
# Omarchy already does the heavy lifting in apps/pip.conf: it tags anything
# whose title matches "Picture in picture" with `pip`, and applies float + pin.
# Its defaults are sourced BEFORE this file, so we only override what we want
# different here (it uses 600x338 in the top-right corner).
#
# Tune the PiP by touching only these three variables:
$pip_w = 810
$pip_h = 456
$pip_gap = 40

windowrule = size $pip_w $pip_h, match:tag pip

# CAREFUL: do not swap these constants for window_w/window_h. When `move` is
# evaluated the window still has Chrome's original size (512x288) -- the `size`
# rule above has not taken effect yet. With window_w the math yields 2888,1112
# on a 3440x1440 monitor, i.e. the PiP is born partly offscreen.
windowrule = move (monitor_w-$pip_w-$pip_gap) (monitor_h-$pip_h-$pip_gap), match:tag pip

# Never steals keyboard focus (mouse clicks still work).
# Drop this line if you would rather use keyboard shortcuts on the PiP.
windowrule = no_focus on, match:tag pip
